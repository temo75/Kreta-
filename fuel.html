<!DOCTYPE html>
<html lang="ka"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087dcc"><title>TEMO • კრეტის საწვავის ფასები</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f7fb;color:#183247;font-family:Arial,sans-serif}header{background:linear-gradient(135deg,#087dcc,#064d83);color:#fff;text-align:center;padding:23px 12px}.brand{font-size:12px;letter-spacing:4px;font-weight:800}h1{font-size:clamp(22px,5vw,29px);margin:10px 0 7px}header p{margin:0;color:#dceeff;font-size:14px}main{max-width:900px;margin:auto;padding:15px 12px 32px}.back{display:inline-block;color:#087dcc;text-decoration:none;font-weight:700;margin:2px 0 14px}.section-title{font-size:19px;margin:13px 4px}.regions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.region{padding:13px 10px;background:#fff;border:1px solid #d9e8f3;border-radius:13px;color:#183247;font-weight:700;cursor:pointer}.region.active{background:#e5f4ff;border-color:#087dcc;color:#075f9c}.status{font-size:12px;color:#6b8192;padding:7px 4px}.station{background:#fff;border:1px solid #d9e8f3;border-radius:16px;padding:16px;margin:10px 0;box-shadow:0 5px 18px #173e550b}.name{font-size:17px;font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:9px}.brand-logo{display:inline-flex;align-items:center;justify-content:center;min-width:48px;height:32px;padding:0 7px;border-radius:8px;background:#087dcc;color:#fff;font-size:11px;font-weight:900;letter-spacing:.2px;box-shadow:0 2px 7px #087dcc30}.address{font-size:13px;color:#6b8192;margin-bottom:12px}.prices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px}.price{background:#edf7ff;border-radius:10px;padding:10px 6px;text-align:center}.fuel{display:block;color:#607b8d;font-size:11px;margin-bottom:5px}.value{font-weight:800;color:#087dcc;font-size:16px}.updated{font-size:11px;color:#8596a3;margin-top:10px}.location-btn{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:10px 14px;border-radius:11px;background:#e8f3ff;border:1px solid #c9e2fa;color:#075f9c;text-decoration:none;font-weight:700;font-size:13px}.location-btn svg{width:19px;height:19px;flex:none}.error{background:#fff4e5;color:#7c4a00;padding:14px;border-radius:12px;line-height:1.5}.foot{font-size:11px;color:#8295a4;text-align:center;padding:12px}@media(max-width:430px){.prices{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body>
<header><div class="brand">TEMO</div><h1>⛽ კრეტის საწვავის ფასები</h1><p>ონლაინ განახლებული სადგურები და ფასები</p></header>
<main><a class="back" href="./">← მთავარი გვერდი</a><h2 class="section-title">📍 რეთიმნო პირველია</h2>
<div class="regions" id="regions"><button class="region active" data-region="Ρέθυμνο">📍 რეთიმნო</button><button class="region" data-region="Ηράκλειο">ჰერაკლიონი</button><button class="region" data-region="Χανιά">ქანია</button><button class="region" data-region="Λασίθι">ლასითი</button></div>
<div id="status" class="status"></div><section id="stations"></section>
<div class="foot">ონლაინ წყაროდან მონაცემები ავტომატურად მოიძებნება დაახლოებით ყოველ 5 წუთში. გვერდი მონაცემებს ამოწმებს ყოველ 1 წუთში. ფასები და ბოლო განახლების დრო წყაროს მიხედვით.</div></main>
<script>
let data=null,selected='Ρέθυμνο';
const map={'Ρέθυμνο':'Ρέθυμνο','Ηράκλειο':'Ηράκλειο','Χανιά':'Χανιά','Λασίθι':'Λασίθι'};
const names={'95':'ბენზინი 95','100':'ბენზინი 100','diesel':'დიზელი','autogas':'ავტოგაზი'};
function render(){const region=data?.regions?.find(x=>x.region===selected);const box=document.getElementById('stations');if(!region){box.innerHTML='<div class="error">ამ რეგიონის მონაცემები ჯერ ვერ ჩაიტვირთა. ცოტა ხანში სცადე ხელახლა.</div>';return}
document.getElementById('status').textContent='ამ რეგიონში სადგურები: '+region.stations.length+' • მონაცემი: '+new Date(data.fetched_at).toLocaleString('el-GR');
box.innerHTML=region.stations.map(s=>'<article class="station"><div class="name"><span class="brand-logo">'+esc((s.name||'STATION').slice(0,10))+'</span><span>'+esc(s.name)+'</span></div><div class="address">'+esc(s.address||'მისამართი წყაროში მითითებული არ არის')+'</div><div class="prices">'+s.prices.map(p=>'<div class="price"><span class="fuel">'+(names[p.type]||esc(p.type))+'</span><span class="value">'+(p.price?Number(p.price).toLocaleString("el-GR",{minimumFractionDigits:3,maximumFractionDigits:3})+" €":"—")+'</span></div>').join('')+'</div><a class="location-btn" href="https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.latitude+','+s.longitude)+'" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 5-8 12-8 12S4 15 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg>Google Maps — ლოკაცია</a><div class="updated">წყაროს ბოლო განახლება: '+esc(s.updated||'მითითებული არ არის')+'</div></article>').join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
document.querySelectorAll('.region').forEach(b=>b.addEventListener('click',()=>{selected=b.dataset.region;document.querySelectorAll('.region').forEach(x=>x.classList.toggle('active',x===b));render()}));
function showUnavailable(){document.getElementById('status').textContent='';document.getElementById('stations').innerHTML='<div style="padding:8px 4px;color:#6b8192;font-size:13px">ამ რეგიონის ონლაინ ფასები ამჟამად მიუწვდომელია.</div>'}
function loadFuelData(){fetch('./fuel-data.json?'+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('data unavailable');return r.json()}).then(d=>{data=d;render()}).catch(showUnavailable)}
loadFuelData();
setInterval(loadFuelData,60*1000);
</script></body></html>
