async function load(){document.getElementById('info').textContent='🔎 ვეძებ ახლომდებარე ობიექტებს…';results.innerHTML='<div class="loading">იტვირთება…</div>';try{const d=await over(query(catNow));const duties=catNow==='pharmacy'?dutyNow():[];const arr=d.elements.map(e=>{const p=e.lat!=null?[e.lat,e.lon]:e.center?[e.center.lat,e.center.lon]:null;if(!p)return null;const t=e.tags||{};const ss=st(t);return{lat:p[0],lon:p[1],t,n:t.name||t['name:en']||t['name:el']||'უსახელო ობიექტი',d:dist(lat,lon,p[0],p[1]),isOpen:ss[1]==='open'}}).filter(Boolean).map(p=>{if(catNow==='pharmacy'){const v=duties.find(x=>norm(x.phone)===norm(p.t.phone||p.t['contact:phone']||''));if(v)p.duty=v}return p}).sort((a,b)=>{if(catNow==='pharmacy'&&!!a.duty!==!!b.duty)return a.duty?-1:1;if(catNow==='pharmacy'&&a.isOpen!==b.isOpen)return a.isOpen?-1:1;return a.d-b.d});document.getElementById('info').textContent='ნაპოვნია '+arr.length+' ობიექტი • უახლოესი პირველია';results.innerHTML=arr.length?arr.map(p=>{const s=st(p.t),rawA=p.t['addr:street']?(p.t['addr:street']+' '+(p.t['addr:housenumber']||'')):(p.t['addr:full']||'მისამართი უცნობია'),v=pharmacyMatch(p.t,rawA),name=v?v.name:p.n,a=v?v.addr:rawA,ph=v?v.phone:(p.t.phone||p.t['contact:phone']||'');return'<div class="card"><h3>'+esc(name)+'</h3><div class="meta">📍 '+(p.d<1?Math.round(p.d*1000)+' მ':p.d.toFixed(1)+' კმ')+'<br>🏠 '+esc(a)+'<br><span class="'+s[1]+'">'+esc(s[0])+'</span>'+(ph?'<br>📞 '+esc(ph):'')+'</div><div class="actions"><button onclick="showMap('+p.lat+','+p.lon+')">🗺️ რუკა</button><button class="secondary" onclick="route('+p.lat+','+p.lon+')">🚗 გზა</button>'+(ph?'<button class="secondary" onclick="location.href=\'tel:'+ph.replace(/[^+\d]/g,'')+'\'">📞 დარეკვა</button>':'')+'</div></div>'}).join(''):'<div class="card">😔 ამ რადიუსში ვერაფერი ვიპოვე.</div>'}catch(e){document.getElementById('info').textContent='❌ ძიება ვერ შესრულდა';results.innerHTML='<div class="card">ინტერნეტთან ან რუკის მონაცემებთან პრობლემაა. ისევ სცადე.</div>'}}
document.getElementById('radius').onchange=()=>lat&&load();document.getElementById('back').onclick=()=>page.classList.remove('show');function showMap(a,b){page.classList.remove('show');map.setView([a,b],17);L.popup().setLatLng([a,b]).setContent('📍 ობიექტი').openOn(map)}function route(a,b){window.open('https://www.google.com/maps/dir/?api=1&destination='+a+','+b,'_blank')}
function getLocation(auto=false){if(!navigator.geolocation){status.textContent='ამ ბრაუზერს GPS არ აქვს.';return}if(!auto)status.textContent='📍 GPS მდებარეობას ვიღებ…';navigator.geolocation.getCurrentPosition(p=>{lat=p.coords.latitude;lon=p.coords.longitude;try{localStorage.setItem('kretaLocationData',JSON.stringify({lat,lon,accuracy:p.coords.accuracy,time:Date.now()}))}catch(e){}if(marker)map.removeLayer(marker);if(circle)map.removeLayer(circle);marker=L.marker([lat,lon]).addTo(map).bindPopup('📍 შენი მდებარეობა').openPopup();circle=L.circle([lat,lon],{radius:p.coords.accuracy}).addTo(map);map.setView([lat,lon],16);status.textContent='📍 მდებარეობა მიღებულია • სიზუსტე ±'+Math.round(p.coords.accuracy)+' მ';cards.innerHTML='<div class="card"><h3>კატეგორია აირჩიე 👇</h3><div class="meta">აირჩიე სასურველი კატეგორია და გაიხსნება ცალკე გვერდი.</div></div>'},e=>{if(!auto)status.textContent='GPS-ის მიღება ვერ მოხერხდა: '+e.message},{enableHighAccuracy:true,timeout:15000,maximumAge:30000})}
document.getElementById('locate').onclick=()=>getLocation(false);
function restoreLocation(){
  try{
    const x=JSON.parse(localStorage.getItem('kretaLocationData')||'null');
    if(x&&Date.now()-x.time<3600000){
      lat=x.lat;lon=x.lon;
      if(marker)map.removeLayer(marker);if(circle)map.removeLayer(circle);
      marker=L.marker([lat,lon]).addTo(map).bindPopup('📍 შენი მდებარეობა');
      circle=L.circle([lat,lon],{radius:x.accuracy||50}).addTo(map);
      map.setView([lat,lon],16);
      status.textContent='📍 მდებარეობა ჩართულია';
      cards.innerHTML='<div class="card"><h3>კატეგორია აირჩიე 👇</h3><div class="meta">აირჩიე სასურველი კატეგორია და გაიხსნება ცალკე გვერდი.</div></div>';
      return;
    }
  }catch(e){}
}
restoreLocation();
document.getElementById('open').onclick=()=>status.textContent=lat?'🟢 აირჩიე კატეგორია — შემდეგ გვერდზე გამოჩნდება ობიექტების სტატუსი.':'📍 ჯერ ჩართე ჩემი მდებარეობა';document.getElementById('all').onclick=()=>status.textContent=lat?'აირჩიე სასურველი კატეგორია ზემოთ.':'📍 ჯერ ჩართე ჩემი მდებარეობა';
</script></body></html>
