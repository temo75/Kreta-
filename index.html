function minutesNow(){const n=new Date();return n.getHours()*60+n.getMinutes()}
function inHours(start,end){const [sh,sm]=start.split(':').map(Number),[eh,em]=end.split(':').map(Number),q=minutesNow(),a=sh*60+sm,b=eh*60+em;return a<=b?q>=a&&q<b:(q>=a||q<b)}

function pharmacyMatch(t,a){
  if(catNow!=='pharmacy')return null;
  const clean=s=>norm(s).replace(/\\D/g,'');
  const phone=clean(t.phone||t['contact:phone']||'');
  if(phone){
    const byPhone=vriskoPharmacies.find(v=>clean(v.phone)===phone);
    if(byPhone)return byPhone;
  }

  const greekToLatin=s=>String(s||'').toLowerCase()
    .replace(/ά|α/g,'a').replace(/β/g,'v').replace(/γ/g,'g').replace(/δ/g,'d')
    .replace(/ε|έ/g,'e').replace(/ζ/g,'z').replace(/η|ή/g,'i').replace(/θ/g,'th')
    .replace(/ι|ί|ϊ|ΐ/g,'i').replace(/κ/g,'k').replace(/λ/g,'l').replace(/μ/g,'m')
    .replace(/ν/g,'n').replace(/ξ/g,'x').replace(/ο|ό/g,'o').replace(/π/g,'p')
    .replace(/ρ/g,'r').replace(/σ|ς/g,'s').replace(/τ/g,'t').replace(/υ|ύ|ϋ|ΰ/g,'y')
    .replace(/φ/g,'f').replace(/χ/g,'ch').replace(/ψ/g,'ps').replace(/ω|ώ/g,'o')
    .replace(/[^a-z0-9]+/g,' ');

  const source=String([t.name,t['addr:street'],t['addr:housenumber'],t['addr:full'],a].filter(Boolean).join(' '));
  const ns=norm(source), ls=greekToLatin(source);
  const num=(source.match(/\\b\\d{1,3}\\b/)||[])[0]||'';
  const tokens=s=>norm(s).split(/[^a-z0-9α-ω]+/i)
    .filter(w=>w.length>=4&&!['rethymno','rethymnou','pharmacy','pharmakeio','pharmakeia','φαρμακειο','φαρμακεια'].includes(w));
  const latinTokens=s=>greekToLatin(s).split(/\\s+/).filter(w=>w.length>=4&&!['rethymno','pharmacy','pharmakeio'].includes(w));
  const sw=tokens(source), sl=latinTokens(source);

  let best=null,bestScore=0;
  for(const v of vriskoPharmacies){
    const va=norm(v.addr), vn=norm(v.name), vl=greekToLatin(v.name+' '+v.addr);
    const vw=tokens(v.addr), vwl=latinTokens(v.addr), vnl=latinTokens(v.name);
    let score=0;
    const vnum=(v.addr.match(/\\b\\d{1,3}\\b/)||[])[0]||'';
    if(num&&vnum&&num===vnum)score+=12;
    score+=vw.filter(w=>sw.includes(w)).length*5;
    score+=vwl.filter(w=>sl.includes(w)).length*5;
    if(vn&&ns.includes(vn))score+=30;
    if(vnl.filter(w=>w.length>=5&&sl.includes(w)).length)score+=20;
    if(va&&ns.includes(va))score+=40;
    if(vl&&ls.includes(vl))score+=40;
    if(score>bestScore){bestScore=score;best=v;}
  }
  return bestScore>=12?best:null;
}

}
async function over(q){
  const urls=[
    'https://overpass-api.de/api/interpreter',
    'https://overpass.private.coffee/api/interpreter',
    'https://z.overpass-api.de/api/interpreter',
    'https://maps.mail.ru/osm/tools/overpass/api/interpreter'
  ];
  const one=async function(u){
    const ctl=new AbortController();
    const tm=setTimeout(function(){ctl.abort()},25000);
    try{
      const response=await fetch(u+'?data='+encodeURIComponent(q),{
        method:'GET',
        headers:{'Accept':'application/json'},
        signal:ctl.signal,
        cache:'no-store'
      });
      if(!response.ok)throw Error('Overpass HTTP '+response.status);
      const data=await response.json();
      if(data&&Array.isArray(data.elements))return data;
      throw Error('Overpass invalid response');
    }finally{clearTimeout(tm)}
  };
  return Promise.any(urls.map(one));
}

function pharmacyDistanceText(d){

}
let pharmacyRenderItems=[];
function phoneHref(raw){

  if(!d)return '';
  return d.startsWith('30')?'+'+d:'+30'+d;
}

function pharmacyRouteByIndex(i){

function pharmacyCard(p,i){
  const v=p.v||p;
  const duty=p.duty||pharmacyDuty(v);
  const status=duty?'<span class="open">🟢 ახლა ღიაა • მორიგე</span>':(p.isOpen?'<span class="open">🟢 ახლა ღიაა</span>':'<span class="unknown">ℹ️ საათები ვერ დადასტურდა</span>');
  const ph=String(v.phone||'');
  let buttons='';

    buttons+='<button onclick="showMap('+p.lat+','+p.lon+')">🗺️ რუკა</button>';
    buttons+='<button class="secondary" onclick="route('+p.lat+','+p.lon+')">🚗 გზა</button>';
  }else{
    buttons+='<button class="secondary" onclick="pharmacyRouteByIndex('+i+')">🚗 გზა</button>';
  }
  if(ph){
    buttons+='<button class="secondary" onclick="callPhone(\''+phoneHref(ph)+'\')">📞 '+esc(ph)+' დარეკვა</button>';
  }
  return '<div class="card"><h3>'+esc(v.name)+'</h3><div class="meta">'+pharmacyDistanceText(p.d)+'<br>🏠 '+esc(v.addr)+'<br>'+status+(duty?'<br>🕐 '+esc(duty.start)+'–'+esc(duty.end):'')+(ph?'<br>📞 '+esc(ph):'')+'</div><div class="actions">'+buttons+'</div></div>';

function renderPharmacies(arr,sourceLabel){
  const duties=dutyNow();
  pharmacyRenderItems=arr.map(function(x){
    const v=x.v||x;
    const phone=String(v.phone||'').replace(/\\D/g,'');

    if(!duty)duty=duties.find(function(d){return String(d.phone||'').replace(/\\D/g,'')===phone})||null;
    return Object.assign({},x,{v:v,duty:duty});
  });
  pharmacyRenderItems.sort(function(a,b){
    if(!!a.duty!==!!b.duty)return a.duty?-1:1;
    const ad=Number.isFinite(a.d)?a.d:Infinity;
    const bd=Number.isFinite(b.d)?b.d:Infinity;
    if(ad!==bd)return ad-bd;

  });
  document.getElementById('info').textContent='';
  results.innerHTML=pharmacyRenderItems.length?pharmacyRenderItems.map(function(p,i){return pharmacyCard(p,i)}).join(''):'<div class="card">😔 აფთიაქები ვერ მოიძებნა.</div>';
}
const categoryCache={};
const categoryLoading={};
const categoryMeta={};
const CATEGORY_CACHE_KEY='kreta_category_cache_v2';
const CATEGORY_CACHE_TTL=24*60*60*1000;
let preloadRunning=false;
let preloadLat=null,preloadLon=null,preloadRadius=null;

function categoryCacheKey(id){
  return id+'|'+document.getElementById('radius').value;
}
function cacheIsFresh(key){
  const m=categoryMeta[key];
  return Array.isArray(categoryCache[key])&&!!m&&Date.now()-m.fetchedAt<CATEGORY_CACHE_TTL&&
    m.radius===document.getElementById('radius').value&&
    Number.isFinite(m.lat)&&Number.isFinite(m.lon)&&dist(m.lat,m.lon,lat,lon)<=1;
}
function persistCategoryCache(){
  try{
    const saved={version:2,categories:{}};
    Object.keys(categoryCache).forEach(function(key){
      if(categoryMeta[key])saved.categories[key]={meta:categoryMeta[key],items:categoryCache[key]};
    });
    localStorage.setItem(CATEGORY_CACHE_KEY,JSON.stringify(saved));
  }catch(_){}
}
function restoreCategoryCache(){
  try{
    const saved=JSON.parse(localStorage.getItem(CATEGORY_CACHE_KEY)||'null');
    if(!saved||saved.version!==2||!saved.categories)return 0;
    let count=0;
    Object.keys(saved.categories).forEach(function(key){
      const entry=saved.categories[key],m=entry&&entry.meta,items=entry&&entry.items;
      if(!m||!Array.isArray(items)||!Number.isFinite(m.fetchedAt)||
         Date.now()-m.fetchedAt>=CATEGORY_CACHE_TTL||
         m.radius!==document.getElementById('radius').value||
         !Number.isFinite(m.lat)||!Number.isFinite(m.lon)||dist(m.lat,m.lon,lat,lon)>1)return;
      categoryCache[key]=items.map(function(p){
        if(p&&Number.isFinite(p.lat)&&Number.isFinite(p.lon))p.d=dist(lat,lon,p.lat,p.lon);
        return p;
      });
      categoryMeta[key]=m;
      count++;
    });
    return count;
  }catch(_){return 0}
}
function persistCategoryCache(){
  try{
    localStorage.setItem(CATEGORY_CACHE_KEY,JSON.stringify({
      savedAt:Date.now(),
      lat:lat,
      lon:lon,
      radius:document.getElementById('radius').value,
      items:categoryCache
    }));
  }catch(_){}
}
function restoreCategoryCache(){
  try{
    const saved=JSON.parse(localStorage.getItem(CATEGORY_CACHE_KEY)||'null');
    if(!saved||!saved.items||!Number.isFinite(saved.savedAt)||Date.now()-saved.savedAt>=CATEGORY_CACHE_TTL){
      localStorage.removeItem(CATEGORY_CACHE_KEY);
      return false;
    }
    if(!Number.isFinite(saved.lat)||!Number.isFinite(saved.lon))return false;
    if(saved.radius!==document.getElementById('radius').value||dist(saved.lat,saved.lon,lat,lon)>1)return false;
    Object.keys(saved.items).forEach(function(k){categoryCache[k]=saved.items[k]});
    preloadLat=lat;preloadLon=lon;preloadRadius=saved.radius;
    return cats.every(function(cat){return !!categoryCache[categoryCacheKey(cat[0])]});
  }catch(_){return false}
}

async function fetchCategoryData(id){
  if(id==='pharmacy'){
    return vriskoPharmacies.map(function(v){
      return {v:v,d:Infinity,lat:null,lon:null,isOpen:false};
    });
  }
  const d=await over(query(id));
  return d.elements.map(function(e){
    const p=e.lat!=null?[e.lat,e.lon]:e.center?[e.center.lat,e.center.lon]:null;
    if(!p)return null;
    const t=e.tags||{};
    const ss=st(t);
    return {lat:p[0],lon:p[1],t:t,n:t.name||t['name:en']||t['name:el']||'',d:dist(lat,lon,p[0],p[1]),isOpen:ss[1]==='open'};
  }).filter(Boolean).sort(function(a,b){
    if(a.isOpen!==b.isOpen)return a.isOpen?-1:1;
    return a.d-b.d;
  });
}

async function prepareCategory(id,forceRefresh){
  const key=categoryCacheKey(id);
  if(!forceRefresh&&cacheIsFresh(key))return categoryCache[key];
  if(categoryLoading[key])return categoryLoading[key];
  categoryLoading[key]=(async function(){
    let lastError=null;
    for(let attempt=1;attempt<=3;attempt++){
      try{
        const arr=await fetchCategoryData(id);
        categoryCache[key]=arr;
        categoryMeta[key]={fetchedAt:Date.now(),lat:lat,lon:lon,radius:document.getElementById('radius').value};
        persistCategoryCache();
        delete categoryLoading[key];
        return arr;
      }catch(e){
        lastError=e;
        if(attempt<3)await new Promise(function(resolve){setTimeout(resolve,700)});
      }
    }
    delete categoryLoading[key];
    throw lastError||Error('category load failed');
  })();
  return categoryLoading[key];
}

function renderGeneralCategory(arr){

    const s=st(p.t);

    const ph=p.t.phone||p.t['contact:phone']||'';

    const phoneButton=ph?'<button class="secondary" onclick="callPhone(\''+phoneHref(ph)+'\')">📞 '+esc(ph)+' დარეკვა</button>':'';

  }).join(''):'<div class="card">😔 ამ რადიუსში ვერაფერი ვიპოვე.</div>';

async function preloadAllCategories(){
  if(preloadRunning)return;
  preloadRunning=true;
  const runRadius=document.getElementById('radius').value;
  const ids=cats.map(function(cat){return cat[0]}).filter(function(id){return !cacheIsFresh(categoryCacheKey(id))});
  if(!ids.length){
    preloadRunning=false;
    preloadLat=lat;preloadLon=lon;preloadRadius=runRadius;
    status.textContent='🌐 ინტერნეტიდან მონაცემები მზადაა';
    return;
  }
  // No progress message: keep the page immediately usable.
  let done=cats.length-ids.length;
  const failed=[];
  const worker=async function(){
    while(ids.length){
      const id=ids.shift();
      try{await prepareCategory(id,true)}catch(_){failed.push(id)}
      done++;
      // Keep the interface quiet; categories load independently in the background.
    }
  };
  await Promise.all([worker(),worker()]);
  preloadRunning=false;
  const ready=cats.every(function(cat){return cacheIsFresh(categoryCacheKey(cat[0]))});
  // Record the location/radius for this attempt even if one source failed,
  // so each GPS watch update does not start the whole preload again.
  preloadLat=lat;preloadLon=lon;preloadRadius=runRadius;
  if(ready){
    status.textContent='📍 მდებარეობა ჩართულია • ყველა კატეგორია მზადაა';
  }else{
    status.textContent='⚠️ ზოგი მონაცემი ვერ ჩაიტვირთა. სცადე განახლება.';
  }
}

async function renderFuelPrices(){
  const info=document.getElementById('info');
  const target=document.getElementById('results');
  info.textContent='⛽ Vrisko-ს ფასებს ვამოწმებ…';
  try{
    const response=await fetch('./fuel-prices.json?t='+Date.now(),{cache:'no-store'});
    if(!response.ok)throw Error('no fuel data');
    const data=await response.json();
    if(!Array.isArray(data.items)||!data.items.length)throw Error('empty fuel data');
    const labels={unleaded95:'95 ბენზინი',unleaded100:'100 ბენზინი',diesel:'დიზელი',autogas:'გაზი'};
    target.innerHTML=data.items.map(function(item){
      const priceRows=Object.keys(labels).filter(k=>item.prices&&item.prices[k]!=null).map(k=>'<div>⛽ '+labels[k]+': <strong>'+Number(item.prices[k]).toFixed(3)+' € / ლ</strong></div>').join('');
      return '<div class="card"><h3>'+esc(item.name||'ბენზინგასამართი')+'</h3><div class="meta">'+(item.address?('📍 '+esc(item.address)+'<br>'):'')+priceRows+(item.updatedAt?'<br>🕒 Vrisko: '+esc(item.updatedAt):'')+'</div></div>';
    }).join('');
    const stamp=data.fetchedAt?new Date(data.fetchedAt).toLocaleString():'';
    info.textContent='Vrisko • '+data.items.length+' ჩანაწერი'+(stamp?' • შემოწმდა: '+stamp:'');
    return true;
  }catch(_){
    info.textContent='⛽ საწვავის ფასების ავტომატური მონაცემები ჯერ მიუწვდომელია';
    target.innerHTML='<div class="card">ფასები ჯერ ვერ ჩაიტვირთა. სცადე მოგვიანებით.</div>';
    return false;
  }
}
async function load(){
  const id=catNow,key=categoryCacheKey(id);
  if(id==='fuel'){await renderFuelPrices();return;}
  const cached=categoryCache[key],fresh=cacheIsFresh(key);
  if(id==='pharmacy'){
    if(cached)renderPharmacies(cached,'Vrisko-ზე ნაპოვნია '+cached.length+' აფთიაქი • მორიგე პირველია');
    else{
      document.getElementById('info').textContent='';
      results.innerHTML='';
    }
    if(fresh)return;
    try{
      const arr=await prepareCategory(id);
      if(catNow===id)renderPharmacies(arr,'Vrisko-ზე ნაპოვნია '+arr.length+' აფთიაქი • მორიგე პირველია');
    }catch(_){
      if(!cached)document.getElementById('info').textContent='❌ აფთიაქების მონაცემები ვერ ჩაიტვირთა';
    }
    return;
  }
  if(cached)renderGeneralCategory(cached);
  else{
    document.getElementById('info').textContent='';
    results.innerHTML='';
  }
  if(fresh)return;
  try{
    const arr=await prepareCategory(id);
    if(catNow===id)renderGeneralCategory(arr);
  }catch(_){
    if(!cached){
      document.getElementById('info').textContent='❌ ძიება ვერ შესრულდა';
      results.innerHTML='<div class="card">ინტერნეტთან ან რუკის მონაცემებთან პრობლემაა. ისევ სცადე.</div>';
    }else{
      document.getElementById('info').textContent='ნაჩვენებია შენახული შედეგები • განახლება ვერ მოხერხდა';
    }
  }
}
