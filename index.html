async function over(q){
  const urls=[
    'https://overpass.private.coffee/api/interpreter',
    'https://z.overpass-api.de/api/interpreter',
    'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
    'https://overpass-api.de/api/interpreter'
  ];
  const one=async u=>{
    const ctl=new AbortController();
    const tm=setTimeout(()=>ctl.abort(),8000);
    try{
      const r=await fetch(u,{
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded;charset=UTF-8'},
        body:'data='+encodeURIComponent(q),
        signal:ctl.signal,
        cache:'no-store'
      });
      if(!r.ok)throw Error('HTTP '+r.status);
      const d=await r.json();
      if(d&&Array.isArray(d.elements))return d;
      throw Error('invalid response');
    }finally{
      clearTimeout(tm);
    }
  };
  return Promise.any(urls.map(one));
}

async function load(){document.getElementById('info').textContent='🔎 ვეძებ ახლომდებარე ობიექტებს…';results.innerHTML='<div class="loading">იტვირთება…</div>';try{const d=await over(query(catNow));const duties=catNow==='pharmacy'?dutyNow():[];const arr=d.elements.map(e=>{const p=e.lat!=null?[e.lat,e.lon]:e.center?[e.center.lat,e.center.lon]:null;if(!p)return null;const t=e.tags||{};const ss=st(t);return{lat:p[0],lon:p[1],t,n:t.name||t['name:en']||t['name:el']||'უსახელო ობიექტი',d:dist(lat,lon,p[0],p[1]),isOpen:ss[1]==='open'}}).filter(Boolean).map(p=>{if(catNow==='pharmacy'){const v=duties.find(x=>norm(x.phone)===norm(p.t.phone||p.t['contact:phone']||''));if(v)p.duty=v}return p}).sort((a,b)=>{if(catNow==='pharmacy'&&!!a.duty!==!!b.duty)return a.duty?-1:1;if(catNow==='pharmacy'&&a.isOpen!==b.isOpen)return a.isOpen?-1:1;return a.d-b.d});document.getElementById('info').textContent='ნაპოვნია '+arr.length+' ობიექტი • უახლოესი პირველია';results.innerHTML=arr.length?arr.map(p=>{const s=st(p.t),dutyLabel=p.duty?'<br><span class="open">🟠 მორიგე აფთიაქია</span>':'',rawA=p.t['addr:street']?(p.t['addr:street']+' '+(p.t['addr:housenumber']||'')):(p.t['addr:full']||'მისამართი უცნობია'),v=pharmacyMatch(p.t,rawA),name=v?v.name:p.n,a=v?v.addr:rawA,ph=v?v.phone:(p.t.phone||p.t['contact:phone']||'');return'<div class="card"><h3>'+esc(name)+'</h3><div class="meta">📍 '+(p.d<1?Math.round(p.d*1000)+' მ':p.d.toFixed(1)+' კმ')+'<br>🏠 '+esc(a)+'<br><span class="'+s[1]+'">'+esc(s[0])+'</span>'+dutyLabel+(ph?'<br>📞 '+esc(ph):'')+'</div><div class="actions"><button onclick="showMap('+p.lat+','+p.lon+')">🗺️ რუკა</button><button class="secondary" onclick="route('+p.lat+','+p.lon+')">🚗 გზა</button>'+(ph?'<button class="secondary" onclick="location.href=\'tel:'+ph.replace(/[^+\d]/g,'')+'\'">📞 დარეკვა</button>':'')+'</div></div>'}).join(''):'<div class="card">😔 ამ რადიუსში ვერაფერი ვიპოვე.</div>'}catch(e){document.getElementById('info').textContent='❌ ძიება ვერ შესრულდა';results.innerHTML='<div class="card">ინტერნეტთან ან რუკის მონაცემებთან პრობლემაა. ისევ სცადე.</div>'}}
document.getElementById('radius').onchange=()=>lat&&load();document.getElementById('back').onclick=()=>page.classList.remove('show');function showMap(a,b){page.classList.remove('show');map.setView([a,b],17);L.popup().setLatLng([a,b]).setContent('📍 ობიექტი').openOn(map)}function route(a,b){window.open('https://www.google.com/maps/dir/?api=1&destination='+a+','+b,'_blank')}
let locationWatchId=null;
let locationBusy=false;

function applyLocation(p){
  lat=p.coords.latitude;
  lon=p.coords.longitude;
  if(marker)map.removeLayer(marker);
  if(circle)map.removeLayer(circle);
  marker=L.marker([lat,lon]).addTo(map).bindPopup('📍 შენი მდებარეობა').openPopup();
  circle=L.circle([lat,lon],{radius:p.coords.accuracy||50}).addTo(map);
  map.setView([lat,lon],16);
  status.textContent='📍 მდებარეობა დადასტურებულია';
  cards.innerHTML='<div class="card"><h3>კატეგორია აირჩიე 👇</h3><div class="meta">აირჩიე სასურველი კატეგორია და გაიხსნება ცალკე გვერდი.</div></div>';
}

function locationError(e){
  locationBusy=false;
  if(e.code===1){
    status.innerHTML='📍 მდებარეობის ნებართვა საჭიროა.<br><button class="secondary" style="margin-top:8px" onclick="getLocation()">📍 მდებარეობის ჩართვა</button>';
  }else if(e.code===2){
    status.innerHTML='📍 ტელეფონის Location ვერ მოიძებნა.<br><button class="secondary" style="margin-top:8px" onclick="getLocation()">📍 ხელახლა ცდა</button>';
  }else if(e.code===3){
    status.innerHTML='📍 მდებარეობის მიღებას დრო დასჭირდა.<br><button class="secondary" style="margin-top:8px" onclick="getLocation()">📍 ხელახლა ცდა</button>';
  }else{
    status.innerHTML='📍 მდებარეობის მიღება ვერ მოხერხდა.<br><button class="secondary" style="margin-top:8px" onclick="getLocation()">📍 ხელახლა ცდა</button>';
  }
}

function startLocationWatch(){
  if(locationWatchId!==null)return;
  locationWatchId=navigator.geolocation.watchPosition(applyLocation,locationError,{
    enableHighAccuracy:true,
    timeout:20000,
    maximumAge:5000
  });
}

function getLocation(){
  if(!navigator.geolocation){
    status.textContent='ამ ბრაუზერს მდებარეობის ფუნქცია არ აქვს.';
    return;
  }
  if(locationBusy)return;
  locationBusy=true;
  status.textContent='📍 ტელეფონიდან მდებარეობას ვიღებ…';

  navigator.geolocation.getCurrentPosition(p=>{
    locationBusy=false;
    applyLocation(p);
    startLocationWatch();
  },e=>{
    if(e.code===1){
      locationError(e);
      return;
    }
    navigator.geolocation.getCurrentPosition(p=>{
      locationBusy=false;
      applyLocation(p);
      startLocationWatch();
    },locationError,{
      enableHighAccuracy:false,
      timeout:20000,
      maximumAge:0
    });
  },{
    enableHighAccuracy:true,
    timeout:12000,
    maximumAge:0
  });
}

getLocation();
document.getElementById('open').onclick=()=>status.textContent=lat?'🟢 აირჩიე კატეგორია — შემდეგ გვერდზე გამოჩნდება ობიექტების სტატუსი.':'📍 ჯერ ჩართე ჩემი მდებარეობა';document.getElementById('all').onclick=()=>status.textContent=lat?'აირჩიე სასურველი კატეგორია ზემოთ.':'📍 ჯერ ჩართე ჩემი მდებარეობა';
</script></body></html>
