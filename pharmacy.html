let schedule={
"2026-10-09":{day:["Αλεφαντινού Μαρία"],night:["Παπατζανή Μαρία"]},

};
let activeNames=[];
function officialHours(p){
 const s=(p.address+" "+p.name);
 const city=/Ρέθυμνο|Κουντουριώτου|Δημητρακάκη|Αρκαδίου|Μοάτσου|Γερακάρη|Τρανταλίδου|Δημοκρατίας|Κουρμούλη|Κουμουνδούρου|Ηγουμένου Γαβριήλ|Πορτάλιου|Παχλά|Αντιστάσεως|Ζαμπελίου|Σικελιανού|Καλλέργη|Μπουνιαλή|Τσουδερού|Ασκούτση|Χατζηδάκη|Μανιουδάκη|Χορτάτζη/.test(s);
 if(city)return {text:"Δευτ./Τετ. 08:30–15:00 · Τρ./Πέμ./Παρ. 08:30–14:30 και 18:00–21:00 · Σαβ./Κυρ. κλειστά εκτός εφημερίας",type:"city"};
 const armenoi=/Αρμέν|Armen/i.test(s);
 if(armenoi)return {text:"Δευτέρα–Παρασκευή 09:00–17:00 · Σαβ./Κυρ. κλειστά εκτός εφημερίας",type:"armenoi"};
 return null;
}
function statusFor(p){
 if(activeNames.includes(p.name))return "open";
 const h=officialHours(p);if(!h)return "unknown";
 const d=new Date(),day=d.getDay(),t=d.getHours()+d.getMinutes()/60;
 if(day===0||day===6)return "closed";
 if(h.type==="armenoi")return t>=9&&t<17?"open":"closed";
 if(day===1||day===3)return t>=8.5&&t<15?"open":"closed";
 if(day===2||day===4||day===5)return (t>=8.5&&t<14.5)||(t>=18&&t<21)?"open":"closed";
 return "unknown";
}

function updateDuty(){
 const now=new Date(), key=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0'), hour=now.getHours()+now.getMinutes()/60;
 document.getElementById('date').textContent='Ημερομηνία: '+new Intl.DateTimeFormat('el-GR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).format(now);
 let data=schedule[key];
 if(hour<8){const prev=new Date(now);prev.setDate(prev.getDate()-1);const pk=prev.getFullYear()+'-'+String(prev.getMonth()+1).padStart(2,'0')+'-'+String(prev.getDate()).padStart(2,'0');if(schedule[pk])data=schedule[pk]}
 const isNight=hour>=21||hour<8;
 activeNames=data?(isNight?data.night:data.day).map(p=>typeof p==='string'?p:p.name):[];
 const duty=document.getElementById('duty');
 duty.innerHTML=activeNames.length?pharmacies.filter(p=>activeNames.includes(p.name)).map(p=>card(p,true)).join(''):'<article class="pharmacy">მორიგეობის მონაცემი დროებით მიუწვდომელია.</article>';
}
async function loadOfficialData(){
 try {
  const [catalogResponse,dutyResponse]=await Promise.all([
   fetch('./pharmacies.json?'+Date.now(),{cache:'no-store'}),
   fetch('./duty.json?'+Date.now(),{cache:'no-store'})
  ]);
  if(!catalogResponse.ok||!dutyResponse.ok)throw new Error('Official data files are not available yet');
  const catalog=await catalogResponse.json(), dutyData=await dutyResponse.json();
  if(!Array.isArray(catalog.pharmacies)||catalog.pharmacies.length<20)throw new Error('Catalog validation failed');
  if(!Array.isArray(dutyData.schedule)||!dutyData.schedule.some(d=>d.date&&(d.day?.length||d.night?.length)))throw new Error('Duty schedule validation failed');
  pharmacies=catalog.pharmacies;
  const freshSchedule={};
  for(const entry of dutyData.schedule){
   if(entry.date)freshSchedule[entry.date]={day:Array.isArray(entry.day)?entry.day:[],night:Array.isArray(entry.night)?entry.night:[]};
  }
  if(!Object.keys(freshSchedule).length)throw new Error('No valid duty dates');
  schedule=freshSchedule;
 } catch(error) {
  console.warn('Using embedded pharmacy data until official sync succeeds:',error);
 }
 updateDuty();
 renderAll();
}
function areaFor(p){const s=(p.address||"").toLowerCase();if(/ρεθυμνο|ρέθυμνο|κουρμουλη|κουντουριωτου|αρκαδιου|μοατσου|τρανταλιδου|γερακαρη|δημοκρατιας|κουμουνδουρου|παχλα|πορταλιου|χορτατζη|ζαμπελιου|ηγεμονου γαβριηλ|καλλεργη|μπουνιαλη|ασκουτση|δασκαλακη/.test(s))return "რეთიმნო";if(/τσιποπουλο|ατσιποπουλο/.test(s))return "აციპოპულო";if(/ανωγεια/.test(s))return "ანოგია";if(/περαμα/.test(s))return "პერამა";if(/πλακια/.test(s))return "პლაკიასი";if(/σπηλι/.test(s))return "სპილი";if(/μπαλι/.test(s))return "ბალი";if(/ζωνιανα/.test(s))return "ზონიანა";if(/αγια γαληνη/.test(s))return "აგია გალიინი";if(/επισκοπη/.test(s))return "ეპისკოპი";if(/γερανι/.test(s))return "გერანი";if(/πρινες/.test(s))return "პრინესი";if(/πανορμο/.test(s))return "პანორმო";if(/φουρφουρα/.test(s))return "ფურფურასი";if(/μαργαριτες/.test(s))return "მარგარიტესი";if(/πηγη/.test(s))return "პიჯი";if(/σταυρωμενος/.test(s))return "სტავრომენოსი";if(/αρμενοι/.test(s))return "არმენოი";if(/αδελιανος καμπος/.test(s))return "ადელიანოს კამპოსი";if(/αργυρουπολη/.test(s))return "არგირუპოლი";if(/κισσου καμπος/.test(s))return "კისოს კამპოსი";if(/σφακακι/.test(s))return "სფაკაკი";if(/αγια φωτεινη/.test(s))return "აგია ფოტინი";if(/περιβολια/.test(s))return "პერივოლია";if(/μαλι/.test(s))return "მალი";if(/γαραζο/.test(s))return "გარაზო";return "რეთიმნოს მუნიციპალიტეტი";}function card(p,active){const st=statusFor(p),h=officialHours(p),area=areaFor(p),phoneLinks=p.phones.map(n=>'<a href="tel:'+n+'">☎ '+n+'</a>').join(' ');const map='https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(p.name+', '+p.address+', Rethymno, Crete, Greece')+'&travelmode=driving';const label=active?'🌙 ახლა მორიგეა':st==='open'?'🟢 ღიაა':st==='closed'?'🔴 დაკეტილია':'❔ საათები დასაზუსტებელია';return '<article class="pharmacy '+(active?'active':'')+'"><div class="status '+st+'">'+label+'</div><div class="pname">'+p.name+'</div><div class="details">📍 მდებარეობა: '+area+'</div><div class="details">მისამართი: '+p.address+'</div><div class="details">☎ '+p.phones.join(' · ')+'</div><div class="hours">⏰ '+(h?h.text:'ოფიციალური საათები ამ მისამართისთვის ვერ დადასტურდა')+'</div><div class="links">'+phoneLinks+'<a target="_blank" rel="noopener" href="'+map+'">მარშრუტი რუკაზე</a></div></article>'}
function renderAll(){document.getElementById("count").textContent="ნაპოვნია "+pharmacies.length+" აფთიაქი";const rest=pharmacies.filter(p=>!activeNames.includes(p.name));document.getElementById("all").innerHTML=rest.map(p=>card(p,false)).join("")}
updateDuty();
renderAll();
loadOfficialData();
</script>
