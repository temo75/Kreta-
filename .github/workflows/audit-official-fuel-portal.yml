name: Audit official fuel observatory
on:
  push:
    paths:
      - "scripts/audit_official_fuel_portal.py"
      - ".github/workflows/audit-official-fuel-portal.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install requests
      - name: Inspect official public portal endpoints
        run: python scripts/audit_official_fuel_portal.py
