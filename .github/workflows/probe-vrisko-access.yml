name: Test Vrisko access variants
on:
  push:
    paths:
      - "scripts/probe_vrisko_access.py"
      - ".github/workflows/probe-vrisko-access.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install requests beautifulsoup4
      - run: python scripts/probe_vrisko_access.py
