name: Probe official fuel price form
on:
  push:
    paths:
      - 'scripts/probe_official_checkprices.py'
      - '.github/workflows/probe-official-checkprices.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install requests beautifulsoup4
      - run: python scripts/probe_official_checkprices.py
