name: Update Rethymno fuel prices
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fuel-prices
  cancel-in-progress: true
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install requests beautifulsoup4
      - name: Fetch prices from Vrisko
        run: python scripts/update_fuel_prices.py
      - name: Commit updated data
        run: |
          if git diff --quiet -- fuel-prices.json; then
            echo "No changes in fuel prices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fuel-prices.json
          git commit -m "Update Rethymno fuel prices"
          git push
