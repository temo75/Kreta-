name: Test 4real fuel source (read-only)
on:
  workflow_dispatch:
  push:
    branches:
      - "test/fuel-source-4real-2026-10-12"
    paths:
      - "scripts/test_4real_fuel_source.py"
      - "scripts/compare_4real_with_current.py"
      - ".github/workflows/test-4real-fuel-source.yml"
permissions:
  contents: read
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install requests
      - name: Fetch and parse 4real pages without changing live data
        run: python scripts/test_4real_fuel_source.py
      - name: Compare source prices with current data by exact station phone
        run: python scripts/compare_4real_with_current.py
