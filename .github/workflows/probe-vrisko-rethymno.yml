name: Test Vrisko Rethymno fuel source
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install requests beautifulsoup4
      - name: Check public Vrisko page
        run: python scripts/probe_vrisko_rethymno.py
